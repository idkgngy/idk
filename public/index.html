<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Strike Arena</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="game"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hud">
    <header><div class="brand">NEON <strong>STRIKE</strong></div><div id="connection">CONNECTING</div></header>
    <div class="match"><span>ROUND 01</span><b id="timer">10:00</b><span>FREE FOR ALL</span></div>
    <div id="feed"></div>
    <aside id="scoreboard"><h2>SQUAD FEED</h2><div id="score-list"></div></aside>
    <section id="status"><div class="health"><span>VITALS</span><b id="health-value">100</b><div><i id="health-bar"></i></div></div><div class="weapon"><small>PRIMARY</small><strong>VOLT RIFLE</strong><span>AMMO  ∞</span></div></section>
  </div>
  <div id="start-screen"><div class="panel"><p class="eyebrow">SECTOR 07 // LIVE COMBAT NETWORK</p><h1>NEON<br><em>STRIKE</em></h1><p class="tagline">Fast hands. Clean angles. Own the arena.</p><label>CALLSIGN <input id="name-input" maxlength="16" value="RANGER" autocomplete="off"></label><button id="play">ENTER ARENA <span>-></span></button><p class="hint">WASD move <b>SPACE</b> jump <b>CLICK</b> fire <b>ESC</b> release cursor</p></div></div>
  <div id="damage-flash"></div><div id="hit-marker">+</div><div id="banner"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="/client.js"></script>
</body>
</html>
